spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  config:
    import: optional:file:.env[.properties]
  application:
    name: accounting
  ai:
    mcp:
      server:
        protocol: ${MCP_SERVER_PROTOCOL:STREAMABLE}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai-accounting}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:pzr123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

storage:
  type: local
  local:
    root: ${STORAGE_ROOT:./data/files}

accounting:
  balance:
    read-mode: ${ACCOUNTING_BALANCE_READ_MODE:legacy}
    worker-enabled: ${ACCOUNTING_BALANCE_WORKER_ENABLED:false}
    max-lag: ${ACCOUNTING_BALANCE_MAX_LAG:5s}
    worker-delay-ms: ${ACCOUNTING_BALANCE_WORKER_DELAY_MS:250}

springdoc:
  api-docs:
    path: /v1/openapi.json

app:
  accounts:
    ai-url: ${APP_ACCOUNTS_AI_URL:}
    ai-api-key: ${APP_ACCOUNTS_AI_API_KEY:}
  security:
    # Local-only identity fallback. Set false when an OIDC resource server is configured.
    local-user-header-enabled: ${LOCAL_USER_HEADER_ENABLED:false}
