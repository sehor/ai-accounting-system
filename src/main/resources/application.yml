spring:
  application:
    name: accounting
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/accounting}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

storage:
  type: local
  local:
    root: ${STORAGE_ROOT:./data/files}
