interface:
  display_name: "AI Accounting System"
  short_description: "Operate the local accounting MCP safely."
  default_prompt: "Use $operate-ai-accounting to query or update a ledger through the local accounting MCP service."

dependencies:
  tools:
    - type: "mcp"
      value: "accounting"
      description: "Local ai-accounting-system MCP service"
      transport: "streamable_http"
      url: "http://127.0.0.1:8080/mcp"

policy:
  allow_implicit_invocation: true
